name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Only the repo owner (or trusted branches) have deploy secrets; skip
# secret-using steps for pull requests opened from external forks.
env:
  HAS_SECRETS: ${{ secrets.DOCKER_USERNAME != '' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, gd, zip, mbstring, tokenizer, json, curl

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint (Laravel style checker)
        run: |
          cd backend
          composer pint -- --test

      - name: Run tests
        run: |
          cd backend
          php artisan test

      - name: Build Docker image
        if: env.HAS_SECRETS == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker build -f backend.prod.Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/docu-rag-backend:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/docu-rag-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/docu-rag-backend:latest

      - name: Login to Docker Hub
        if: env.HAS_SECRETS == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker images
        if: env.HAS_SECRETS == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docu-rag-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/docu-rag-backend:latest

      - name: Trigger Render deployment
        if: env.HAS_SECRETS == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          curl -X POST "https://api.render.com/deploy/srv${{ secrets.RENDER_SERVICE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "'${{ secrets.DOCKER_USERNAME }}'/docu-rag-backend:latest",
              "healthCheck": "/health",
              "env": {
                "APP_ENV": "production",
                "APP_URL": "'${{ secrets.APP_URL }}'",
                "CORS_ALLOWED_ORIGINS": "'${{ secrets.CORS_ALLOWED_ORIGINS }}'"
              }
            }'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy to Vercel (Production)
        if: env.HAS_SECRETS == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          cd frontend
          npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --project-name=docu-rag-frontend \
            --region=cle1 \
            --env VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --env VITE_APP_NAME=Docu-RAG